name: Dual-Compat CI

on:
  push:
    paths:
      - 'skill-example/**'
  pull_request:
    paths:
      - 'skill-example/**'
  workflow_dispatch:

jobs:
  compat-matrix:
    name: Compat Matrix (V1 + V2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode-version: [v1, v2]
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: skill-example/package-lock.json
      - name: Install deps
        working-directory: skill-example
        run: npm ci
      - name: Type-check
        working-directory: skill-example
        run: npx tsc --noEmit
      - name: Test
        working-directory: skill-example
        env:
          OPENCODE_MOCK: 'true'
          OPENCODE_VERSION: ${{ matrix.opencode-version }}
        run: npm run test:${{ matrix.opencode-version }}
      - name: Upload coverage
        if: matrix.opencode-version == 'v2' && matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.opencode-version }}
          path: skill-example/coverage

  zero-dep-gate:
    name: Zero-Dep Gate (Opcao B)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run zero-dep check
        working-directory: skill-example
        run: npm run check:zero-deps

  coverage-gate:
    name: Coverage Gate (>=80% lines / >=70% branches)
    runs-on: ubuntu-latest
    needs: [compat-matrix]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skill-example/package-lock.json
      - name: Install deps
        working-directory: skill-example
        run: npm ci
      - name: Run full test suite with coverage
        working-directory: skill-example
        env:
          OPENCODE_MOCK: 'true'
          OPENCODE_VERSION: v2
        run: npm run test:coverage
