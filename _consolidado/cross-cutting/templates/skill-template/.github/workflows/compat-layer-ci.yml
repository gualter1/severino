# ADR-022 CI: Dual-Runtime Compat-Layer Validation (V1 + V2)
# Valida Bridge Pattern em ambos os runtimes + Zero-Dependency enforcement.

name: compat-layer-ci

on:
  push:
    branches: [main, master]
    paths:
      - '_consolidado/cross-cutting/templates/skill-template/**'
      - '.github/workflows/compat-layer-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '_consolidado/cross-cutting/templates/skill-template/**'

defaults:
  run:
    working-directory: _consolidado/cross-cutting/templates/skill-template

jobs:
  test-matrix:
    name: Test on OpenCode ${{ matrix.opencode-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode-version: [v1, v2]
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: _consolidado/cross-cutting/templates/skill-template/package-lock.json

      - name: Install (devDeps only)
        run: npm ci

      - name: Validate OpenCode Runtime ${{ matrix.opencode-version }}
        run: |
          echo "OPENCODE_MOCK=true" >> $GITHUB_ENV
          echo "OPENCODE_VERSION=${{ matrix.opencode-version }}" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV

      - name: Typecheck (strict)
        run: npx tsc --noEmit

      - name: Run Tests with Coverage (${{ matrix.opencode-version }})
        run: npx vitest run --coverage

      - name: Upload Coverage (${{ matrix.opencode-version }})
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: _consolidado/cross-cutting/templates/skill-template/coverage
          flags: opencode-${{ matrix.opencode-version }}
          fail_ci_if_error: false

  zero-deps-guard:
    name: Zero-Dependency Guard (ADR-022)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install (devDeps only)
        working-directory: _consolidado/cross-cutting/templates/skill-template
        run: npm ci

      - name: Assert Zero Runtime Dependencies
        working-directory: _consolidado/cross-cutting/templates/skill-template
        run: |
          echo "=== Verificando Zero-Dep (ADR-022) ==="
          PROD_COUNT=$(npm ls --prod --parseable 2>/dev/null | grep -v '^$' | wc -l | tr -d ' ')
          echo "Prod deps lines: $PROD_COUNT"
          if [ "$PROD_COUNT" != "0" ]; then
            echo "::error::ZERO-DEP VIOLATION: $PROD_COUNT runtime deps encontradas. package.json deve ter apenas devDependencies."
            npm ls --prod 2>&1 || true
            exit 1
          fi
          echo "✅ Zero-Dep OK: nenhuma runtime dependency."

      - name: Assert package.json has no dependencies key
        working-directory: _consolidado/cross-cutting/templates/skill-template
        run: |
          if node -e "const p=require('./package.json'); if(p.dependencies && Object.keys(p.dependencies).length>0){console.error('dependencies found:',p.dependencies);process.exit(1)}"; then
            echo "✅ package.json sem chave dependencies."
          else
            echo "::error::package.json contém dependencies — remova para manter zero-dep."
            exit 1
          fi